<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#dbeafe;
        }

        .login-box{
            width:400px;
            background:white;
            padding:40px;
            border-radius:15px;
            box-shadow:0 0 15px rgba(0,0,0,0.2);
        }

        .login-box h1{
            text-align:center;
            margin-bottom:30px;
            color:#1e3a8a;
        }

        .input-box{
            margin-bottom:20px;
        }

        .input-box label{
            display:block;
            margin-bottom:8px;
            font-size:18px;
        }

        .input-box input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:16px;
        }

        .btn{
            width:100%;
            padding:12px;
            background:#1e3a8a;
            color:white;
            border:none;
            border-radius:8px;
            font-size:18px;
            cursor:pointer;
            transition:.3s;
        }

        .btn:hover{
            background:#2563eb;
        }

        .register-link{
            text-align:center;
            margin-top:20px;
        }

        .register-link a{
            text-decoration:none;
            color:#1e3a8a;
        }

    </style>

</head>
<body>

    <div class="login-box">

        <h1>Login</h1>

        <form method="POST">

    {% csrf_token %}

            <div class="input-box">
                <label>Email</label>
                <input type="email" name="email" placeholder="Enter Email">
            </div>

            <div class="input-box">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter Password">
            </div>

            <button class="btn">Login</button>

        </form>

        <div class="register-link">
            <p>Don't have an account?
                <a href="">Register</a>
            </p>
        </div>

    </div>

</body>
</html>
