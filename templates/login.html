<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{
            min-height:100vh;
            padding:40px;
            background:#dbeafe;
        }

        .top-section{
            margin-bottom:20px;
        }

        .back-btn{
            background:#1e3a8a;
            color:white;
            padding:12px 22px;
            text-decoration:none;
            border-radius:10px;
            font-size:16px;
            font-weight:bold;
            display:inline-block;
            transition:0.3s;
            box-shadow:0 4px 10px rgba(30,58,138,0.3);
        }

        .back-btn:hover{
            background:#2563eb;
            transform:translateY(-2px);
        }

        .container{
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:80vh;
        }

        .login-box{
            width:400px;
            background:white;
            padding:40px;
            border-radius:15px;
            box-shadow:0 0 15px rgba(0,0,0,0.2);
        }

        .login-box h1{
            text-align:center;
            margin-bottom:30px;
            color:#1e3a8a;
        }

        .input-box{
            margin-bottom:20px;
        }

        .input-box label{
            display:block;
            margin-bottom:8px;
            font-size:18px;
        }

        .input-box input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:16px;
        }

        .btn{
            width:100%;
            padding:12px;
            background:#1e3a8a;
            color:white;
            border:none;
            border-radius:8px;
            font-size:18px;
            cursor:pointer;
            transition:.3s;
        }

        .btn:hover{
            background:#2563eb;
        }

        .register-link{
            text-align:center;
            margin-top:20px;
        }

        .register-link a{
            text-decoration:none;
            color:#1e3a8a;
            font-weight:bold;
        }

    </style>

</head>
<body>

    <div class="top-section">

        <a href="/" class="back-btn">

            ← Back

        </a>

    </div>

    <div class="container">

    <div class="login-box">

        <h1>Login</h1>

        <form method="POST">

            {% csrf_token %}

            <div class="input-box">

                <label>Email</label>

                <input type="email"
                       name="email"
                       placeholder="Enter Email">

            </div>

            <div class="input-box">

                <label>Password</label>

                <input type="password"
                       name="password"
                       placeholder="Enter Password">

            </div>

            <button class="btn">

                Login

            </button>

        </form>

        <div class="register-link">

            <p>

                Don't have an account?

                <a href="/register/">

                    Register

                </a>

            </p>

        </div>

    </div>

    </div>

</body>
</html>
