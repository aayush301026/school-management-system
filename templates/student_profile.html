<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{
            background:#eef2ff;
            min-height:100vh;
            padding:40px;
        }

        .top-section{
            margin-bottom:20px;
        }

        .back-btn{
            background:#2563eb;
            color:white;
            padding:12px 22px;
            text-decoration:none;
            border-radius:10px;
            font-size:16px;
            font-weight:bold;
            display:inline-block;
            transition:0.3s;
            box-shadow:0 4px 10px rgba(37,99,235,0.3);
        }

        .back-btn:hover{
            background:#1d4ed8;
            transform:translateY(-2px);
        }

        .container{
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .profile-box{
            width:900px;
            background:white;
            border-radius:20px;
            overflow:hidden;
            display:flex;
            box-shadow:0 10px 30px rgba(0,0,0,0.1);
        }

        .left{
            width:35%;
            background:linear-gradient(135deg,#2563eb,#1e40af);
            color:white;
            padding:40px 30px;
            text-align:center;
        }

        .left img{
            width:150px;
            height:150px;
            border-radius:50%;
            object-fit:cover;
            border:5px solid white;
            margin-bottom:20px;
        }

        .default-img{
            width:150px;
            height:150px;
            border-radius:50%;
            background:white;
            color:#2563eb;
            font-size:60px;
            display:flex;
            justify-content:center;
            align-items:center;
            margin:auto;
            margin-bottom:20px;
            font-weight:bold;
        }

        .left h2{
            margin-bottom:10px;
            font-size:30px;
        }

        .left p{
            margin-bottom:8px;
            font-size:17px;
            opacity:0.9;
        }

        .right{
            width:65%;
            padding:50px;
        }

        .right h1{
            color:#2563eb;
            margin-bottom:30px;
            font-size:38px;
        }

        .message{
            background:#dcfce7;
            color:#166534;
            padding:12px;
            border-radius:8px;
            margin-bottom:20px;
            text-align:center;
        }

        .input-box{
            margin-bottom:22px;
        }

        .input-box label{
            display:block;
            margin-bottom:8px;
            font-weight:bold;
            color:#444;
        }

        .input-box input,
        .input-box textarea{
            width:100%;
            padding:14px;
            border:1px solid #ccc;
            border-radius:10px;
            font-size:16px;
            outline:none;
            transition:.3s;
        }

        .input-box input:focus,
        .input-box textarea:focus{
            border-color:#2563eb;
            box-shadow:0 0 8px rgba(37,99,235,0.3);
        }

        textarea{
            height:120px;
            resize:none;
        }

        .file-box{
            background:#f5f5f5;
            padding:15px;
            border-radius:10px;
        }

        button{
            width:100%;
            padding:15px;
            border:none;
            border-radius:10px;
            background:#2563eb;
            color:white;
            font-size:18px;
            cursor:pointer;
            transition:.3s;
            margin-top:10px;
        }

        button:hover{
            background:#1d4ed8;
        }

        @media(max-width:900px){

            .profile-box{
                flex-direction:column;
            }

            .left,
            .right{
                width:100%;
            }

        }

    </style>

</head>
<body>

    <div class="top-section">

        <a href="/student-dashboard/" class="back-btn">

            ← Back

        </a>

    </div>

    <div class="container">

    <div class="profile-box">

        <div class="left">

            {% if user.profile_image %}

                <img src="{{user.profile_image.url}}">

            {% else %}

                <div class="default-img">

                    {{user.name|first}}

                </div>

            {% endif %}

            <h2>{{user.name}}</h2>

            <p>{{user.email}}</p>

            <p>{{user.role}}</p>

        </div>

        <div class="right">

            <h1>Edit Profile</h1>

            {% if message %}

                <div class="message">

                    {{message}}

                </div>

            {% endif %}

            <form method="POST" enctype="multipart/form-data">

                {% csrf_token %}

                <div class="input-box">

                    <label>Full Name</label>

                    <input type="text"
                           name="name"
                           value="{{user.name}}">

                </div>

                <div class="input-box">

                    <label>Phone Number</label>

                    <input type="text"
                           name="phone"
                           value="{{user.phone}}">

                </div>

                <div class="input-box">

                    <label>Address</label>

                    <textarea name="address">{{user.address}}</textarea>

                </div>

                <div class="input-box">

                    <label>Profile Image</label>

                    <div class="file-box">

                        <input type="file"
                               name="profile_image">

                    </div>

                </div>

                <button>

                    Update Profile

                </button>

            </form>

        </div>

    </div>

    </div>

</body>
</html>
