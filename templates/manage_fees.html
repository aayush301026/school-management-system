<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Fees</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{
            background:#f5f5f5;
            padding:40px;
        }

        .top-section{
            margin-bottom:20px;
        }

        .back-btn{
            background:#2563eb;
            color:white;
            padding:12px 22px;
            text-decoration:none;
            border-radius:10px;
            font-size:16px;
            font-weight:bold;
            display:inline-block;
            transition:0.3s;
            box-shadow:0 4px 10px rgba(37,99,235,0.3);
        }

        .back-btn:hover{
            background:#1d4ed8;
            transform:translateY(-2px);
        }

        .top-bar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:30px;
            flex-wrap:wrap;
            gap:20px;
        }

        h1{
            color:#2563eb;
            font-size:42px;
        }

        .add-btn{
            background:#059669;
            color:white;
            padding:14px 24px;
            text-decoration:none;
            border-radius:10px;
            font-size:18px;
            font-weight:bold;
            transition:0.3s;
        }

        .add-btn:hover{
            background:#047857;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
            border-radius:15px;
            overflow:hidden;
        }

        th,td{
            padding:18px;
            border:1px solid #ddd;
            text-align:center;
        }

        th{
            background:#2563eb;
            color:white;
            font-size:18px;
        }

        tr:hover{
            background:#f8fafc;
        }

        .update-btn{
            background:#2563eb;
            color:white;
            padding:10px 18px;
            text-decoration:none;
            border-radius:8px;
            font-weight:bold;
            transition:0.3s;
            margin-right:8px;
            display:inline-block;
        }

        .update-btn:hover{
            background:#1d4ed8;
        }

        .delete-btn{
            background:#dc2626;
            color:white;
            padding:10px 18px;
            text-decoration:none;
            border-radius:8px;
            font-weight:bold;
            transition:0.3s;
            display:inline-block;
        }

        .delete-btn:hover{
            background:#b91c1c;
        }

        @media(max-width:900px){

            .top-bar{
                flex-direction:column;
                align-items:flex-start;
            }

            table{
                display:block;
                overflow-x:auto;
            }

        }

    </style>

</head>
<body>

    <div class="top-section">

        <a href="/teacher-dashboard/" class="back-btn">

            ← Back

        </a>

    </div>

    <div class="top-bar">

        <h1>Manage Student Fees</h1>

        <a href="/add-fees/" class="add-btn">

            + Add Student Fees

        </a>

    </div>

    <table>

        <tr>

            <th>Student</th>
            <th>Total Fees</th>
            <th>Paid Fees</th>
            <th>Remaining Fees</th>
            <th>Status</th>
            <th>Action</th>

        </tr>

        {% for fee in fees %}

        <tr>

            <td>{{fee.student.name}}</td>

            <td>{{fee.total_fees}}</td>

            <td>{{fee.paid_fees}}</td>

            <td>{{fee.remaining_fees}}</td>

            <td>{{fee.status}}</td>

            <td>

                <a href="/update-fees/{{fee.id}}/"
                   class="update-btn">

                    Update

                </a>

                <a href="/delete-fees/{{fee.id}}/"
                   class="delete-btn"
                   onclick="return confirm('Are you sure you want to delete this fees record?')">

                    Delete

                </a>

            </td>

        </tr>

        {% endfor %}

    </table>

</body>
</html>
