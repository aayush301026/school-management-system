<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{
            background:#dbeafe;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            padding:30px;
        }

        .register-box{
            width:450px;
            background:white;
            padding:40px;
            border-radius:15px;
            box-shadow:0 0 15px rgba(0,0,0,0.2);
        }

        .register-box h1{
            text-align:center;
            color:#1e3a8a;
            margin-bottom:30px;
        }

        .input-box{
            margin-bottom:20px;
        }

        .input-box label{
            display:block;
            margin-bottom:8px;
            font-size:18px;
        }

        .input-box input,
        .input-box select{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:16px;
        }

        .btn{
            width:100%;
            padding:12px;
            background:#1e3a8a;
            color:white;
            border:none;
            border-radius:8px;
            font-size:18px;
            cursor:pointer;
            transition:.3s;
        }

        .btn:hover{
            background:#2563eb;
        }

        .login-link{
            text-align:center;
            margin-top:20px;
        }

        .login-link a{
            color:#1e3a8a;
            text-decoration:none;
        }

    </style>

</head>
<body>

    <div class="register-box">

        <h1>Register</h1>

        <form method="POST">

    {% csrf_token %}

            <div class="input-box">
                <label>Full Name</label>
                <input type="text" name="name" placeholder="Enter Full Name">
            </div>

            <div class="input-box">
                <label>Email</label>
                <input type="email" name="email" placeholder="Enter Email">
            </div>

            <div class="input-box">
                <label>Phone</label>
                <input type="text" name="phone" placeholder="Enter Phone Number">
            </div>

            <div class="input-box">
                <label>Role</label>

                <select name="role">
                    <option>Student</option>
                    <option>Teacher</option>
                </select>
            </div>

            <div class="input-box">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter Password">
            </div>

            <button class="btn">Register</button>

        </form>

        <div class="login-link">

            <p>
                Already have an account?
                <a href="/login/">Login</a>
            </p>

        </div>

    </div>

</body>
</html>
