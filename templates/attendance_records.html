<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Records</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{
            background:#f5f5f5;
            padding:40px;
        }

        .top-section{
            margin-bottom:20px;
        }

        .back-btn{
            background:#2563eb;
            color:white;
            padding:12px 22px;
            text-decoration:none;
            border-radius:10px;
            font-size:16px;
            font-weight:bold;
            display:inline-block;
            transition:0.3s;
            box-shadow:0 4px 10px rgba(37,99,235,0.3);
        }

        .back-btn:hover{
            background:#1d4ed8;
            transform:translateY(-2px);
        }

        h1{
            text-align:center;
            margin-bottom:40px;
            color:#2563eb;
            font-size:42px;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
            border-radius:15px;
            overflow:hidden;
            box-shadow:0 8px 20px rgba(0,0,0,0.08);
        }

        th,td{
            padding:18px;
            border:1px solid #ddd;
            text-align:center;
        }

        th{
            background:#2563eb;
            color:white;
            font-size:17px;
        }

        tr:hover{
            background:#f9fafb;
        }

        .present{
            background:#dcfce7;
            color:#166534;
            padding:8px 18px;
            border-radius:20px;
            font-weight:bold;
        }

        .absent{
            background:#fee2e2;
            color:#991b1b;
            padding:8px 18px;
            border-radius:20px;
            font-weight:bold;
        }

        .delete-btn{
            background:#dc2626;
            color:white;
            padding:10px 18px;
            border-radius:8px;
            text-decoration:none;
            font-weight:bold;
            transition:0.3s;
            display:inline-block;
        }

        .delete-btn:hover{
            background:#b91c1c;
            transform:translateY(-2px);
        }

    </style>

</head>
<body>

    <div class="top-section">

        <a href="/teacher-dashboard/" class="back-btn">

            ← Back

        </a>

    </div>

    <h1>Attendance Records</h1>

    <table>

        <tr>

            <th>Student</th>
            <th>Email</th>
            <th>Date</th>
            <th>Status</th>
            <th>Action</th>

        </tr>

        {% for record in records %}

        <tr>

            <td>{{record.student.name}}</td>

            <td>{{record.student.email}}</td>

            <td>{{record.date}}</td>

            <td>

                {% if record.status == "Present" %}

                    <span class="present">

                        Present

                    </span>

                {% else %}

                    <span class="absent">

                        Absent

                    </span>

                {% endif %}

            </td>

            <td>

                <a href="/delete-attendance/{{record.id}}/"
                   class="delete-btn">

                    Delete

                </a>

            </td>

        </tr>

        {% endfor %}

    </table>

</body>
</html>
