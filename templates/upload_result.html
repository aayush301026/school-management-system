<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Result</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{
            background:#f5f5f5;
            min-height:100vh;
            padding:40px;
        }

        .top-section{
            margin-bottom:20px;
        }

        .back-btn{
            background:#2563eb;
            color:white;
            padding:12px 22px;
            text-decoration:none;
            border-radius:10px;
            font-size:16px;
            font-weight:bold;
            display:inline-block;
            transition:0.3s;
            box-shadow:0 4px 10px rgba(37,99,235,0.3);
        }

        .back-btn:hover{
            background:#1d4ed8;
            transform:translateY(-2px);
        }

        .container{
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .box{
            width:700px;
            background:white;
            padding:40px;
            border-radius:15px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        h1{
            text-align:center;
            margin-bottom:30px;
            color:#2563eb;
        }

        .message{
            text-align:center;
            color:green;
            margin-bottom:20px;
            font-size:22px;
        }

        select,input{
            width:100%;
            padding:12px;
            margin-bottom:20px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:16px;
        }

        .row{
            display:flex;
            gap:15px;
        }

        .row input{
            width:100%;
        }

        button{
            width:100%;
            padding:14px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:8px;
            font-size:18px;
            cursor:pointer;
        }

        button:hover{
            background:#1d4ed8;
        }

    </style>

</head>
<body>

    <div class="top-section">

        <a href="/teacher-dashboard/" class="back-btn">

            ← Back

        </a>

    </div>

    <div class="container">

    <div class="box">

        <h1>Upload Result</h1>

        {% if message %}

            <div class="message">

                {{message}}

            </div>

        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <select name="student_id">

                {% for student in students %}

                    <option value="{{student.id}}">

                        {{student.name}}

                    </option>

                {% endfor %}

            </select>

            <!-- Subject 1 -->

            <div class="row">

                <input type="text"
                       name="subject1"
                       placeholder="Subject 1 Name">

                <input type="number"
                       name="subject1_marks"
                       placeholder="Marks">

            </div>

            <!-- Subject 2 -->

            <div class="row">

                <input type="text"
                       name="subject2"
                       placeholder="Subject 2 Name">

                <input type="number"
                       name="subject2_marks"
                       placeholder="Marks">

            </div>

            <!-- Subject 3 -->

            <div class="row">

                <input type="text"
                       name="subject3"
                       placeholder="Subject 3 Name">

                <input type="number"
                       name="subject3_marks"
                       placeholder="Marks">

            </div>

            <!-- Subject 4 -->

            <div class="row">

                <input type="text"
                       name="subject4"
                       placeholder="Subject 4 Name">

                <input type="number"
                       name="subject4_marks"
                       placeholder="Marks">

            </div>

            <!-- Subject 5 -->

            <div class="row">

                <input type="text"
                       name="subject5"
                       placeholder="Subject 5 Name">

                <input type="number"
                       name="subject5_marks"
                       placeholder="Marks">

            </div>

            <!-- Subject 6 -->

            <div class="row">

                <input type="text"
                       name="subject6"
                       placeholder="Subject 6 Name">

                <input type="number"
                       name="subject6_marks"
                       placeholder="Marks">

            </div>

            <button>

                Upload Result

            </button>

        </form>

    </div>

    </div>

</body>
</html>
