<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Notice</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{
            background:#f5f5f5;
            min-height:100vh;
            padding:40px;
        }

        .top-section{
            margin-bottom:20px;
        }

        .back-btn{
            background:#2563eb;
            color:white;
            padding:12px 22px;
            text-decoration:none;
            border-radius:10px;
            font-size:16px;
            font-weight:bold;
            display:inline-block;
            transition:0.3s;
            box-shadow:0 4px 10px rgba(37,99,235,0.3);
        }

        .back-btn:hover{
            background:#1d4ed8;
            transform:translateY(-2px);
        }

        .container{
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .box{
            width:500px;
            background:white;
            padding:40px;
            border-radius:15px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        h1{
            text-align:center;
            margin-bottom:30px;
            color:#059669;
        }

        input,textarea{
            width:100%;
            padding:12px;
            margin-bottom:20px;
            border:1px solid #ccc;
            border-radius:8px;
        }

        textarea{
            height:120px;
        }

        button{
            width:100%;
            padding:12px;
            background:#059669;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-size:18px;
        }

        .message{
            text-align:center;
            color:green;
            margin-bottom:20px;
            font-size:20px;
        }

    </style>

</head>
<body>

    <div class="top-section">

        <a href="/teacher-dashboard/" class="back-btn">

            ← Back

        </a>

    </div>

    <div class="container">

    <div class="box">

        <h1>Add Notice</h1>

        {% if message %}

            <div class="message">

                {{message}}

            </div>

        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <input type="text"
                   name="title"
                   placeholder="Enter Notice Title">

            <textarea name="message"
                      placeholder="Enter Notice Message"></textarea>

            <button>

                Add Notice

            </button>

        </form>

    </div>

    </div>

</body>
</html>
