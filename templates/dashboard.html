<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{
            background:#f5f5f5;
        }

        nav{
            background:#1e3a8a;
            color:white;
            padding:18px 50px;
            display:flex;
            justify-content:space-between;
        }

        .container{
            padding:50px;
        }

        .card{
            background:white;
            padding:40px;
            border-radius:15px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        h1{
            color:#1e3a8a;
            margin-bottom:20px;
        }

        p{
            font-size:20px;
            margin-bottom:10px;
        }

        .logout-btn{
            background:red;
            color:white;
            padding:10px 25px;
            text-decoration:none;
            border-radius:8px;
        }

    </style>

</head>
<body>

    <nav>

        <h2>SchoolMS</h2>

        <a href="/logout/" class="logout-btn">Logout</a>

    </nav>

    <div class="container">

        <div class="card">

            <h1>Welcome {{user.name}}</h1>

            <p><b>Email:</b> {{user.email}}</p>

            <p><b>Phone:</b> {{user.phone}}</p>

            <p><b>Role:</b> {{user.role}}</p>

        </div>

    </div>

</body>
</html>
