<!DOCTYPE html>
<html>
<head>
<title>Student Attendance</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#f5f5f5;
    padding:40px;
}

.top-section{
    margin-bottom:20px;
}

.back-btn{
    background:#2563eb;
    color:white;
    padding:12px 22px;
    text-decoration:none;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    display:inline-block;
    transition:0.3s;
    box-shadow:0 4px 10px rgba(37,99,235,0.3);
}

.back-btn:hover{
    background:#1d4ed8;
    transform:translateY(-2px);
}

h1{
    text-align:center;
    color:#2563eb;
    margin-bottom:40px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

th,td{
    padding:16px;
    border:1px solid #ddd;
    text-align:center;
}

th{
    background:#2563eb;
    color:white;
}

tr:hover{
    background:#f8fafc;
}

.present{
    color:green;
    font-weight:bold;
}

.absent{
    color:red;
    font-weight:bold;
}

</style>

</head>
<body>

<div class="top-section">

    <a href="/student-dashboard/" class="back-btn">

        ← Back

    </a>

</div>

<h1>Student Attendance</h1>

<table>

<tr>

<th>Date</th>
<th>Status</th>

</tr>

{% for a in attendance %}

<tr>

<td>{{a.date}}</td>

<td>

    {% if a.status == "Present" %}

        <span class="present">

            Present

        </span>

    {% else %}

        <span class="absent">

            Absent

        </span>

    {% endif %}

</td>

</tr>

{% endfor %}

</table>

</body>
</html>
